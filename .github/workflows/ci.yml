name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python dependencies
        run: uv sync --extra test --frozen

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Node doctor
        run: uv run python -m apps.api.nodeflow_api.node_doctor nodes --strict

      - name: Backend tests
        run: uv run python -m pytest tests/api -q

      - name: Frontend tests
        run: pnpm --filter @node-flow/web test

      - name: Frontend production build
        run: pnpm build:web

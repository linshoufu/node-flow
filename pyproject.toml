[project]
name = "node-flow"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "packaging>=24.0",
  "pydantic>=2.12.0",
  "uvicorn[standard]>=0.34.0"
]

[project.scripts]
nodeflow-doctor = "apps.api.nodeflow_api.node_doctor:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["outsource", ".qoder", ".nodeflow-packages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
